{% extends "dashboard/base.html" %}

{% block title %}
<title>Регистрация</title>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-4"></div>
    <div class="col-4">
        {% if error %}
            <div class="alert alert-danger mt-3">{{ error }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            {{ form.email }}
            {{ form.password1 }}
            {{ form.password2 }}
            <button class="w-100 btn btn-lg btn-primary mt-3" type="submit">Зарегистрироваться</button>
        </form>
        <p class="mt-3">Уже есть аккаунт? <a href="{% url 'user:auth' %}">Войти</a></p>
    </div>
    <div class="col-4"></div>
</div>
{% endblock %}
