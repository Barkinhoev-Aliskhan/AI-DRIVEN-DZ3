{% extends "dashboard/base.html" %}

{% block title %}<title>Удаление операции</title>{% endblock %}

{% block content %}
<form method="post">
    {% csrf_token %}
    <p>Удалить операцию: <b>"{{ object }}"</b>? Позиции портфеля пересчитаются автоматически.</p>
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'tracker:portfolio_detail' object.portfolio.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
