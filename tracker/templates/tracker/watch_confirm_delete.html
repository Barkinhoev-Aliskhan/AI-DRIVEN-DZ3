{% extends "dashboard/base.html" %}

{% block title %}<title>Удаление наблюдения</title>{% endblock %}

{% block content %}
<form method="post">
    {% csrf_token %}
    <p>Удалить наблюдение: <b>"{{ object }}"</b>?</p>
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'tracker:watch_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
